<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZAide</title>
<meta name="description" content="EZAide, a care-tracking app for iPad.">
<style>
  :root {
    --bg: #ffffff; --text: #1d1d1f; --muted: #5f6368; --rule: #e3e3e6; --accent: #2f6fdb; --box: #f4f6fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121315; --text: #ececee; --muted: #a2a5ab; --rule: #2c2e33; --accent: #7aa7ff; --box: #1c1e22; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 36px 0 8px; padding-top: 20px; border-top: 1px solid var(--rule); }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .summary { background: var(--box); border-radius: 12px; padding: 16px 18px; margin: 0 0 8px; }
  .summary p:last-child { margin-bottom: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>EZAide</h1>
  <p class="meta">A care-tracking app for iPad</p>
  <div class="summary">
    <p>EZAide helps families and caregivers keep track of daily care tasks, medications, feeds and supplies on a shared iPad. Everything stays on the device.</p>
  </div>
  <h2>Support</h2>
  <p>Questions or problems: <a href="mailto:ezaide.app@gmail.com">ezaide.app@gmail.com</a></p>
  <h2>Privacy</h2>
  <p>Read the <a href="privacy.html">EZAide Privacy Policy</a>.</p>
</main>
</body>
</html>
